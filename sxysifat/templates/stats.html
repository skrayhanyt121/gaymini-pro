<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaymini pro — Stats</title>
  <link rel="stylesheet" href="/sxysifat/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/jpeg" href="/sxysifat/banner.jpg" />
  <style>
    body { padding: 16px 12px 32px; }

    .stats-card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 0 0 20px;
    }

    /* ── Header ── */
    .stats-banner {
      background: linear-gradient(135deg, #1a1a2e 0%, #3b0764 100%);
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stats-banner-icon {
      width: 44px; height: 44px;
      background: rgba(124,58,237,0.35);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #c4b5fd; flex-shrink: 0;
    }
    .stats-banner h1 { font-size: 17px; font-weight: 900; color: #fff; letter-spacing: 0.3px; }
    .stats-banner p  { font-size: 11px; color: #a78bfa; margin-top: 2px; }
    .stats-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #a78bfa; font-size: 11px; font-weight: 600;
      text-decoration: none; margin-left: auto;
      padding: 6px 11px; background: rgba(255,255,255,0.08);
      border-radius: 8px; white-space: nowrap; transition: background 0.15s;
    }
    .stats-back:hover { background: rgba(255,255,255,0.16); }

    .stats-body { padding: 16px 16px 0; }

    /* ── Status row ── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 10px; padding: 9px 13px;
      margin-bottom: 14px; font-size: 12px; font-weight: 600; color: #166534;
    }
    .status-row.offline { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .online-dot {
      width: 8px; height: 8px; background: #4ade80;
      border-radius: 50%; display: inline-block;
      animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
    }
    .offline-dot { background: #f87171; animation: none; }

    /* ── Stat grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #fafafa;
      border: 1px solid #ede9fe;
      border-radius: 13px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-box .val {
      font-size: 20px; font-weight: 900;
      color: #6d28d9;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.1;
    }
    .stat-box .lbl {
      font-size: 9.5px; color: #999; margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }

    /* ── Endpoint breakdown ── */
    .section-title {
      font-size: 10px; font-weight: 700; color: #7c3aed;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .ep-stat-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid #f5f0ff;
      font-size: 12px;
    }
    .ep-stat-row:last-child { border-bottom: none; }
    .ep-stat-name {
      font-family: 'JetBrains Mono', monospace;
      color: #1a1a2e; font-weight: 600; flex: 1; font-size: 11px;
    }
    .ep-stat-bar-wrap {
      flex: 2; background: #f0ebff; border-radius: 20px; height: 5px; overflow: hidden;
    }
    .ep-stat-bar { height: 100%; background: linear-gradient(90deg,#7c3aed,#a855f7); border-radius: 20px; transition: width 0.7s ease; }
    .ep-stat-count {
      font-family: 'JetBrains Mono', monospace;
      color: #7c3aed; font-weight: 700; font-size: 11px;
      min-width: 24px; text-align: right;
    }

    /* ── Terminal Log ── */
    .terminal-wrap {
      margin-top: 16px;
    }
    .terminal-window {
      background: #0d1117;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #21262d;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .terminal-header {
      background: #161b22;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid #21262d;
    }
    .t-dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .t-dot.red    { background: #ff5f57; }
    .t-dot.yellow { background: #febc2e; }
    .t-dot.green  { background: #28c840; }
    .terminal-title {
      margin-left: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #8b949e;
      flex: 1;
      text-align: center;
    }
    .terminal-live {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #3fb950;
      font-weight: 700;
    }
    .live-dot {
      width: 6px; height: 6px; background: #3fb950;
      border-radius: 50%; animation: pulse 1.4s ease-in-out infinite;
    }

    .terminal-body {
      padding: 12px 14px;
      height: 240px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.8;
      scroll-behavior: smooth;
    }
    .terminal-body::-webkit-scrollbar { width: 4px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .log-line {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .log-ts  { color: #484f58; flex-shrink: 0; font-size: 10.5px; padding-top: 1px; }
    .log-lvl { flex-shrink: 0; font-weight: 700; font-size: 10.5px; min-width: 56px; }
    .log-msg { color: #e6edf3; word-break: break-all; }

    .log-lvl.INFO    { color: #58a6ff; }
    .log-lvl.SUCCESS { color: #3fb950; }
    .log-lvl.WARN    { color: #d29922; }
    .log-lvl.ERROR   { color: #f85149; }
    .log-lvl.REQUEST { color: #bc8cff; }

    .log-msg.INFO    { color: #cdd9e5; }
    .log-msg.SUCCESS { color: #7ee787; }
    .log-msg.WARN    { color: #e3b341; }
    .log-msg.ERROR   { color: #ffa198; }
    .log-msg.REQUEST { color: #d2a8ff; }

    .cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: #58a6ff;
      border-radius: 1px;
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .terminal-footer {
      background: #161b22;
      border-top: 1px solid #21262d;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .t-footer-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #8b949e;
    }
    .clear-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #8b949e;
      background: none;
      border: 1px solid #30363d;
      border-radius: 5px;
      padding: 3px 9px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { color: #e6edf3; border-color: #58a6ff; }

    /* ── Refresh button ── */
    .refresh-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 14px 16px 0;
      background: linear-gradient(135deg, #6d28d9, #a855f7);
      color: #fff; border: none; padding: 12px;
      border-radius: 13px; font-size: 13px; font-weight: 700;
      cursor: pointer; width: calc(100% - 32px);
      transition: all 0.18s;
      box-shadow: 0 4px 14px rgba(109,40,217,0.3);
    }
    .refresh-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(109,40,217,0.4); }

    .last-updated {
      text-align: center; font-size: 10px; color: #bbb;
      margin-top: 8px; font-family: 'JetBrains Mono', monospace;
    }

    .stats-footer {
      text-align: center; font-size: 11px; color: #9ca3af;
      padding: 14px 18px 0; border-top: 1.5px dashed #e5e7eb; margin-top: 14px;
    }
    .stats-footer a { color: #7c3aed; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="stats-card">

    <!-- Header -->
    <div class="stats-banner">
      <div class="stats-banner-icon"><i class="fa-solid fa-chart-pie"></i></div>
      <div>
        <h1>API Stats</h1>
        <p>Live usage dashboard</p>
      </div>
      <a href="/" class="stats-back"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>

    <div class="stats-body">

      <!-- Status -->
      <div class="status-row" id="statusRow">
        <span class="online-dot" id="statusDot"></span>
        <span id="statusText">Gaymini pro is <strong>ONLINE</strong></span>
        <span style="margin-left:auto;font-weight:400;color:#555;font-size:11px" id="uptimeSpan">—</span>
      </div>

      <!-- Summary grid -->
      <div class="stat-grid">
        <div class="stat-box">
          <div class="val" id="totalReqs">—</div>
          <div class="lbl">Requests</div>
        </div>
        <div class="stat-box">
          <div class="val" id="uptimeVal">—</div>
          <div class="lbl">Uptime</div>
        </div>
        <div class="stat-box">
          <div class="val" id="endpointCount">18</div>
          <div class="lbl">Endpoints</div>
        </div>
        <div class="stat-box">
          <div class="val" id="cookieStatus">—</div>
          <div class="lbl">Cookies</div>
        </div>
      </div>

      <!-- Endpoint breakdown -->
      <div class="section-title"><i class="fa-solid fa-chart-bar"></i> Endpoint Breakdown</div>
      <div id="epBreakdown">
        <div style="color:#aaa;font-size:12px;padding:12px 0;text-align:center">
          <i class="fa-solid fa-spinner fa-spin"></i> &nbsp;Loading...
        </div>
      </div>

      <!-- Terminal Log -->
      <div class="terminal-wrap">
        <div class="section-title" style="margin-bottom:8px">
          <i class="fa-solid fa-terminal"></i> Server Log
        </div>
        <div class="terminal-window">
          <div class="terminal-header">
            <span class="t-dot red"></span>
            <span class="t-dot yellow"></span>
            <span class="t-dot green"></span>
            <span class="terminal-title">gaymini-pro — server log</span>
            <span class="terminal-live"><span class="live-dot"></span> LIVE</span>
          </div>
          <div class="terminal-body" id="terminalBody">
            <div class="log-line">
              <span class="log-ts">--:--:--</span>
              <span class="log-lvl INFO">[INFO]</span>
              <span class="log-msg INFO">Connecting to server...</span>
            </div>
          </div>
          <div class="terminal-footer">
            <span class="t-footer-info" id="logCount">0 entries</span>
            <button class="clear-btn" onclick="clearLogs()">clear</button>
          </div>
        </div>
      </div>

    </div>

    <button class="refresh-btn" onclick="loadStats(); loadLogs()">
      <i class="fa-solid fa-rotate-right"></i> Refresh
    </button>
    <div class="last-updated" id="lastUpdated">—</div>

    <div class="stats-footer">
      POWERED BY <a href="https://github.com/MYB-SIFAT" target="_blank">@SIFAT</a> &bull; 2026
    </div>
  </div>

  <script>
    const EP_LABELS = {
      gemini: '/api/gemini', chat: '/api/chat',
      chat_history: '/api/chat/history', chat_stream: '/api/chat/stream',
      image: '/api/image', image_generate: '/api/image/generate',
      image_edit: '/api/image/edit', image_style: '/api/image/style',
      image_proxy: '/api/image/proxy', vision: '/api/vision',
      translate: '/api/translate',
      summarize: '/api/summarize', rewrite: '/api/rewrite',
      code: '/api/code', deep_research: '/api/deep-research',
      video: '/api/video', video_proxy: '/api/video/proxy',
      models: '/api/models', status: '/api/status',
    };

    // ── Stats ──────────────────────────────────────────────
    async function loadStats() {
      try {
        const [statsRes, statusRes] = await Promise.all([
          fetch('/api/stats'), fetch('/api/status')
        ]);
        const stats = await statsRes.json();
        const status = await statusRes.json();

        document.getElementById('totalReqs').textContent = stats.total_requests ?? 0;

        const upRaw = stats.uptime ?? '—';
        document.getElementById('uptimeVal').textContent = upRaw.replace('h ', 'h\n').split('\n')[0];
        document.getElementById('uptimeSpan').textContent = upRaw;

        const cookOk = status.cookies_loaded;
        const cookEl = document.getElementById('cookieStatus');
        cookEl.textContent = cookOk ? '✓' : '✗';
        cookEl.style.color = cookOk ? '#16a34a' : '#dc2626';

        const eps = stats.endpoints || {};
        const keys = Object.keys(EP_LABELS);
        document.getElementById('endpointCount').textContent = keys.length;

        const maxVal = Math.max(1, ...Object.values(eps).map(e => e.calls ?? 0));
        const sorted = keys
          .map(key => ({ key, label: EP_LABELS[key], calls: (eps[key]?.calls ?? 0) }))
          .filter(x => x.calls > 0)
          .sort((a, b) => b.calls - a.calls);

        if (sorted.length === 0) {
          document.getElementById('epBreakdown').innerHTML =
            '<div style="color:#bbb;font-size:11.5px;padding:10px 0;text-align:center;font-family:\'JetBrains Mono\',monospace">No requests yet</div>';
        } else {
          document.getElementById('epBreakdown').innerHTML = sorted.map(({ label, calls }) => {
            const pct = Math.round((calls / maxVal) * 100);
            return `<div class="ep-stat-row">
              <span class="ep-stat-name">${label}</span>
              <div class="ep-stat-bar-wrap"><div class="ep-stat-bar" style="width:${pct}%"></div></div>
              <span class="ep-stat-count">${calls}</span>
            </div>`;
          }).join('');
        }

        document.getElementById('lastUpdated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('epBreakdown').innerHTML =
          `<div style="color:#f87171;font-size:11px;padding:8px">Error: ${e.message}</div>`;
      }
    }

    // ── Terminal Log ───────────────────────────────────────
    let _lastTs = 0;
    let _localLogs = [];
    let _cleared = false;

    function fmt(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('en-GB', { hour12: false });
    }

    function renderLogs() {
      const body = document.getElementById('terminalBody');
      const visible = _cleared ? [] : _localLogs;
      if (visible.length === 0) {
        body.innerHTML = `<div class="log-line">
          <span class="log-ts">--:--:--</span>
          <span class="log-lvl INFO">[INFO]</span>
          <span class="log-msg INFO">Waiting for events...<span class="cursor"></span></span>
        </div>`;
        document.getElementById('logCount').textContent = '0 entries';
        return;
      }

      body.innerHTML = visible.map(e => `
        <div class="log-line">
          <span class="log-ts">${fmt(e.ts)}</span>
          <span class="log-lvl ${e.level}">[${e.level}]</span>
          <span class="log-msg ${e.level}">${escHtml(e.msg)}</span>
        </div>`).join('') +
        `<div style="padding-top:2px"><span class="cursor"></span></div>`;

      document.getElementById('logCount').textContent = `${visible.length} entries`;
      body.scrollTop = body.scrollHeight;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/logs?limit=200');
        const data = await res.json();
        const logs = data.logs || [];
        if (logs.length > 0) {
          _lastTs = Math.max(...logs.map(l => l.ts));
          _localLogs = logs;
          renderLogs();
        }
      } catch {}
    }

    async function pollLogs() {
      try {
        const res = await fetch(`/api/logs?since=${_lastTs}&limit=50`);
        const data = await res.json();
        const newLogs = data.logs || [];
        if (newLogs.length > 0) {
          _lastTs = Math.max(...newLogs.map(l => l.ts));
          _localLogs.push(...newLogs);
          if (_localLogs.length > 200) _localLogs = _localLogs.slice(-200);
          if (!_cleared) renderLogs();
        }
      } catch {}
    }

    function clearLogs() {
      _cleared = true;
      renderLogs();
    }

    // Init
    loadStats();
    loadLogs();
    setInterval(loadStats, 15000);
    setInterval(pollLogs, 3000);
  </script>
</body>
</html>
